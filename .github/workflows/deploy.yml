name: CI/CD Kedai Kopi Saung

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI - Cek kode
    runs-on: self-hosted
    steps:
      - name: Ambil source code
        uses: actions/checkout@v5

      - name: Pasang dependensi dan cek sintaks di container Node 22
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e npm_config_cache=/tmp/.npm \
            -v "$PWD":/app -w /app node:22-alpine sh -c "
              npm ci --omit=dev --no-audit --no-fund &&
              node --check server.js &&
              node --check seed.js &&
              node --check public/app.js &&
              node --check public/admin.js &&
              echo 'CI lulus: semua file JavaScript valid'
            "

  cd:
    name: CD - Deploy ke Coolify
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Picu deploy di Coolify dan tunggu versi baru aktif
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          START=$(date -u +%s)
          echo "Memicu deploy untuk commit ${GITHUB_SHA::7}..."
          curl --fail-with-body -sS -X POST "$COOLIFY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN"
          echo
          URL=https://saung.novyanrizkywahyudi.com
          for i in $(seq 1 36); do
            sleep 10
            D=$(curl -sk --resolve saung.novyanrizkywahyudi.com:443:127.0.0.1 $URL/api/info | sed -n 's/.*"deployedAt":"\([^"]*\)".*/\1/p')
            if [ -n "$D" ] && [ "$(date -u -d "$D" +%s)" -ge "$START" ]; then
              echo "Versi baru aktif sejak $D"
              curl -sk --resolve saung.novyanrizkywahyudi.com:443:127.0.0.1 $URL/health
              echo
              exit 0
            fi
            echo "Menunggu Coolify selesai build dan deploy... ($i)"
          done
          echo "Deploy belum selesai dalam 6 menit"
          exit 1
